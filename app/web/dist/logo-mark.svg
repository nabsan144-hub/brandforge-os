<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="BrandForge OS mark">
  <defs>
    <linearGradient id="vgold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6CE6B"/>
      <stop offset="1" stop-color="#C98A2B"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1524"/>
      <stop offset="1" stop-color="#080D18"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="114" height="114" rx="30" fill="url(#tile)" stroke="#F6CE6B" stroke-opacity="0.28" stroke-width="1.5"/>
  <!-- the spark: one gold diamond — the moment raw material becomes a brand.
       Same diamond as the old crown point, kept for identity continuity. -->
  <rect x="78.6" y="16.6" width="10.8" height="10.8" transform="rotate(45 84 22)" fill="url(#vgold)"/>
  <!-- the anvil: geometric side profile — face, horn, waist, base.
       The forge is the brand promise: heavy, permanent, OWNED. -->
  <path d="M96,38 L30,38 L14,44 L30,50 L50,50 L54,72 L44,72 L36,98 L88,98 L80,72 L70,72 L74,50 L96,50 Z" fill="url(#vgold)"/>
</svg>
